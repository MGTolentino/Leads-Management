<!DOCTYPE html>
<html>
<head>
    <title>Month/Year Filter Test</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/momentjs/latest/moment.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/daterangepicker/daterangepicker.min.js"></script>
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/daterangepicker/daterangepicker.css" />
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .test-section { margin: 20px 0; padding: 15px; border: 1px solid #ddd; }
        .filter-group { margin: 10px 0; }
        label { display: inline-block; width: 150px; }
        select, input { margin: 5px; padding: 5px; }
        .debug-output { background: #f5f5f5; padding: 10px; margin: 10px 0; border-left: 3px solid #007cba; }
        .debug-output h4 { margin: 0 0 10px 0; }
        .success { color: green; }
        .error { color: red; }
        .warning { color: orange; }
    </style>
</head>
<body>
    <h1>Month/Year Filter Test</h1>
    
    <div class="test-section">
        <h2>1. Basic Month/Year Selectors</h2>
        
        <div class="filter-group">
            <label for="anio_evento">Year:</label>
            <select id="anio_evento">
                <option value="">Select Year</option>
                <option value="2023">2023</option>
                <option value="2024">2024</option>
                <option value="2025">2025</option>
            </select>
        </div>
        
        <div class="filter-group">
            <label for="mes_evento_basic">Month:</label>
            <select id="mes_evento_basic">
                <option value="">Select Month</option>
                <option value="01">January</option>
                <option value="02">February</option>
                <option value="03">March</option>
                <option value="04">April</option>
                <option value="05">May</option>
                <option value="06">June</option>
                <option value="07">July</option>
                <option value="08">August</option>
                <option value="09">September</option>
                <option value="10">October</option>
                <option value="11">November</option>
                <option value="12">December</option>
            </select>
        </div>
        
        <div class="filter-group">
            <label for="fecha_evento_inicio">Start Date:</label>
            <input type="text" id="fecha_evento_inicio" readonly>
        </div>
        
        <div class="filter-group">
            <label for="fecha_evento_fin">End Date:</label>
            <input type="text" id="fecha_evento_fin" readonly>
        </div>
        
        <div class="filter-group">
            <label for="daterange_picker">DateRangePicker:</label>
            <input type="text" id="daterange_picker" placeholder="Select date range">
        </div>
        
        <div class="filter-group">
            <button id="test_sync" style="background: #007cba; color: white; padding: 10px 20px; border: none; cursor: pointer;">Test Synchronization</button>
            <button id="clear_all" style="background: #dc3232; color: white; padding: 10px 20px; border: none; cursor: pointer;">Clear All</button>
        </div>
    </div>
    
    <div class="test-section">
        <h2>2. Debug Output</h2>
        <div id="debug-output" class="debug-output">
            <h4>Debug Information:</h4>
            <div id="debug-log"></div>
        </div>
    </div>
    
    <div class="test-section">
        <h2>3. Test Cases</h2>
        <button onclick="testCase1()" style="margin: 5px; padding: 8px 15px; background: #46b450; color: white; border: none; cursor: pointer;">Test June 2024</button>
        <button onclick="testCase2()" style="margin: 5px; padding: 8px 15px; background: #46b450; color: white; border: none; cursor: pointer;">Test Year 2023</button>
        <button onclick="testCase3()" style="margin: 5px; padding: 8px 15px; background: #46b450; color: white; border: none; cursor: pointer;">Test DateRangePicker → Selectors</button>
    </div>

    <script>
        let debugLog = [];
        
        function log(type, message, data = null) {
            const timestamp = new Date().toLocaleTimeString();
            const entry = { type, message, data, timestamp };
            debugLog.push(entry);
            updateDebugDisplay();
        }
        
        function updateDebugDisplay() {
            const debugDiv = document.getElementById('debug-log');
            const recent = debugLog.slice(-10); // Show last 10 entries
            
            debugDiv.innerHTML = recent.map(entry => {
                const className = entry.type;
                const dataStr = entry.data ? JSON.stringify(entry.data, null, 2) : '';
                return `<div class="${className}">
                    <strong>[${entry.timestamp}] ${entry.type.toUpperCase()}:</strong> ${entry.message}
                    ${dataStr ? `<pre style="margin: 5px 0; font-size: 12px;">${dataStr}</pre>` : ''}
                </div>`;
            }).join('');
        }
        
        function clearLog() {
            debugLog = [];
            updateDebugDisplay();
        }
        
        // Test Cases
        function testCase1() {
            log('success', 'Testing: June 2024');
            $('#anio_evento').val('2024');
            $('#mes_evento_basic').val('06').trigger('change');
        }
        
        function testCase2() {
            log('success', 'Testing: Year 2023 only');
            $('#mes_evento_basic').val('');
            $('#anio_evento').val('2023').trigger('change');
        }
        
        function testCase3() {
            log('success', 'Testing: DateRangePicker to Selectors');
            const drp = $('#daterange_picker').data('daterangepicker');
            if (drp) {
                const start = moment('2024-08-01');
                const end = moment('2024-08-31');
                drp.setStartDate(start);
                drp.setEndDate(end);
                $('#daterange_picker').val(start.format('DD/MM/YYYY') + ' - ' + end.format('DD/MM/YYYY'));
                
                // Test reverse sync
                const year = start.format('YYYY');
                const month = start.format('MM');
                $('#anio_evento').val(year);
                $('#mes_evento_basic').val(month);
                
                log('success', 'DateRangePicker reverse sync completed', { year, month });
            } else {
                log('error', 'DateRangePicker not initialized');
            }
        }
        
        $(document).ready(function() {
            log('success', 'Test page initialized');
            
            // Check dependencies
            if (typeof moment === 'undefined') {
                log('error', 'Moment.js not loaded');
                return;
            }
            
            if (typeof $.fn.daterangepicker === 'undefined') {
                log('error', 'DateRangePicker not loaded');
                return;
            }
            
            log('success', 'All dependencies loaded');
            
            // Initialize DateRangePicker
            try {
                $('#daterange_picker').daterangepicker({
                    startDate: moment(),
                    endDate: moment(),
                    locale: {
                        format: 'DD/MM/YYYY',
                        separator: ' - ',
                        applyLabel: 'Apply',
                        cancelLabel: 'Cancel'
                    },
                    autoUpdateInput: true,
                    autoApply: true
                });
                
                log('success', 'DateRangePicker initialized');
                
                // DateRangePicker events
                $('#daterange_picker').on('apply.daterangepicker', function(ev, picker) {
                    const startDate = picker.startDate.format('YYYY-MM-DD');
                    const endDate = picker.endDate.format('YYYY-MM-DD');
                    
                    $('#fecha_evento_inicio').val(startDate);
                    $('#fecha_evento_fin').val(endDate);
                    
                    // Sync year/month if same month
                    if (picker.startDate.isSame(picker.endDate, 'month')) {
                        const year = picker.startDate.format('YYYY');
                        const month = picker.startDate.format('MM');
                        $('#anio_evento').val(year);
                        $('#mes_evento_basic').val(month);
                        
                        log('success', 'DateRangePicker → Selectors sync', {
                            startDate, endDate, year, month
                        });
                    } else {
                        log('warning', 'DateRangePicker spans multiple months, not syncing selectors', {
                            startDate, endDate
                        });
                    }
                });
                
            } catch (error) {
                log('error', 'DateRangePicker initialization failed', error.message);
            }
            
            // Year selector change
            $('#anio_evento').on('change', function() {
                const year = $(this).val();
                const month = $('#mes_evento_basic').val();
                
                log('success', 'Year changed', { year, month });
                
                if (year) {
                    let startDate, endDate;
                    
                    if (month) {
                        // Month range
                        const lastDay = new Date(year, parseInt(month), 0).getDate();
                        startDate = `${year}-${month.padStart(2, '0')}-01`;
                        endDate = `${year}-${month.padStart(2, '0')}-${lastDay.toString().padStart(2, '0')}`;
                    } else {
                        // Year range
                        startDate = `${year}-01-01`;
                        endDate = `${year}-12-31`;
                    }
                    
                    $('#fecha_evento_inicio').val(startDate);
                    $('#fecha_evento_fin').val(endDate);
                    
                    // Update DateRangePicker
                    const drp = $('#daterange_picker').data('daterangepicker');
                    if (drp) {
                        try {
                            const startMoment = moment(startDate, 'YYYY-MM-DD');
                            const endMoment = moment(endDate, 'YYYY-MM-DD');
                            
                            drp.setStartDate(startMoment);
                            drp.setEndDate(endMoment);
                            $('#daterange_picker').val(startMoment.format('DD/MM/YYYY') + ' - ' + endMoment.format('DD/MM/YYYY'));
                            
                            log('success', 'Year selector → DateRangePicker sync completed', {
                                startDate, endDate, displayValue: $('#daterange_picker').val()
                            });
                        } catch (error) {
                            log('error', 'Failed to sync DateRangePicker from year selector', error.message);
                        }
                    } else {
                        log('warning', 'DateRangePicker not available for sync');
                    }
                }
            });
            
            // Month selector change
            $('#mes_evento_basic').on('change', function() {
                const month = $(this).val();
                const year = $('#anio_evento').val() || new Date().getFullYear();
                
                log('success', 'Month changed', { month, year });
                
                if (month) {
                    const lastDay = new Date(year, parseInt(month), 0).getDate();
                    const startDate = `${year}-${month.padStart(2, '0')}-01`;
                    const endDate = `${year}-${month.padStart(2, '0')}-${lastDay.toString().padStart(2, '0')}`;
                    
                    $('#fecha_evento_inicio').val(startDate);
                    $('#fecha_evento_fin').val(endDate);
                    
                    // Auto-set year if not set
                    if (!$('#anio_evento').val()) {
                        $('#anio_evento').val(year);
                        log('success', 'Auto-set year', { year });
                    }
                    
                    // Update DateRangePicker
                    const drp = $('#daterange_picker').data('daterangepicker');
                    if (drp) {
                        try {
                            const startMoment = moment(startDate, 'YYYY-MM-DD');
                            const endMoment = moment(endDate, 'YYYY-MM-DD');
                            
                            drp.setStartDate(startMoment);
                            drp.setEndDate(endMoment);
                            $('#daterange_picker').val(startMoment.format('DD/MM/YYYY') + ' - ' + endMoment.format('DD/MM/YYYY'));
                            
                            log('success', 'Month selector → DateRangePicker sync completed', {
                                startDate, endDate, displayValue: $('#daterange_picker').val()
                            });
                        } catch (error) {
                            log('error', 'Failed to sync DateRangePicker from month selector', error.message);
                        }
                    } else {
                        log('warning', 'DateRangePicker not available for sync');
                    }
                }
            });
            
            // Test sync button
            $('#test_sync').on('click', function() {
                const state = {
                    year: $('#anio_evento').val(),
                    month: $('#mes_evento_basic').val(),
                    startDate: $('#fecha_evento_inicio').val(),
                    endDate: $('#fecha_evento_fin').val(),
                    daterangePicker: $('#daterange_picker').val(),
                    drpInstance: $('#daterange_picker').data('daterangepicker') ? 'initialized' : 'not initialized'
                };
                
                log('success', 'Current state check', state);
            });
            
            // Clear all button
            $('#clear_all').on('click', function() {
                $('#anio_evento, #mes_evento_basic').val('');
                $('#fecha_evento_inicio, #fecha_evento_fin').val('');
                $('#daterange_picker').val('');
                
                const drp = $('#daterange_picker').data('daterangepicker');
                if (drp) {
                    drp.setStartDate(moment());
                    drp.setEndDate(moment());
                }
                
                clearLog();
                log('success', 'All fields cleared');
            });
        });
    </script>
</body>
</html>
